<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFE Leads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@300;400;500&display=swap">
<style>

:root {
  --bg: #fafaf8;
  --surface: #ffffff;
  --off: #f4f2ee;
  --rule: #e2dfd8;
  --ink: #181816;
  --ink-mid: #3a3a36;
  --ink-light: #7a7870;
  --ink-faint: #b0ada6;
  --blue: #3a6ea8;
  --blue-faint: #eef2f7;
  --green: #2a6e48;
  --green-faint: #eaf4ef;
  --amber: #a05800;
  --amber-faint: #fdf3e6;
  --red: #a82e2e;
  --red-faint: #fdf0f0;
  --purple: #5a3a8a;
  --purple-faint: #f2effe;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110;
    --surface: #1c1c1a;
    --off: #242421;
    --rule: #2e2e2b;
    --ink: #f0ede8;
    --ink-mid: #c8c4be;
    --ink-light: #8a8880;
    --ink-faint: #545250;
    --blue: #5a90cc;
    --blue-faint: #1a2535;
    --green: #4aae78;
    --green-faint: #142519;
    --amber: #e08030;
    --amber-faint: #261808;
    --red: #dd6060;
    --red-faint: #280e0e;
    --purple: #9a78d8;
    --purple-faint: #1c1230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110;
  --surface: #1c1c1a;
  --off: #242421;
  --rule: #2e2e2b;
  --ink: #f0ede8;
  --ink-mid: #c8c4be;
  --ink-light: #8a8880;
  --ink-faint: #545250;
  --blue: #5a90cc;
  --blue-faint: #1a2535;
  --green: #4aae78;
  --green-faint: #142519;
  --amber: #e08030;
  --amber-faint: #261808;
  --red: #dd6060;
  --red-faint: #280e0e;
  --purple: #9a78d8;
  --purple-faint: #1c1230;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 300;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100%;
  padding-inline: 0;
}

/* ── LOCK ── */
#lock {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.lock-card {
  width: 100%; max-width: 360px;
  border: 1px solid var(--rule);
  background: var(--surface);
  padding: 52px 44px;
  text-align: center;
}
.lock-wordmark { font-family: 'Cormorant', Georgia, serif; font-style: italic; font-size: 16px; color: var(--ink); }
.lock-sub { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 44px; }
.lock-h { font-family: 'Cormorant', Georgia, serif; font-size: 26px; font-weight: 300; color: var(--ink); margin-bottom: 6px; }
.lock-desc { font-size: 12px; color: var(--ink-light); margin-bottom: 28px; }
.lock-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--rule); background: var(--off);
  font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 300;
  color: var(--ink); text-align: center; letter-spacing: 5px; outline: none;
  transition: border-color .2s;
  margin-bottom: 10px;
}
.lock-input:focus { border-color: var(--blue); background: var(--surface); }
.lock-input.shake { animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.lock-err { font-size: 11px; color: var(--red); min-height: 15px; margin-bottom: 10px; }
.lock-btn {
  width: 100%; padding: 12px;
  background: var(--ink); color: var(--bg);
  border: none; cursor: pointer;
  font-family: 'Outfit', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; font-weight: 400;
  transition: background .2s;
}
.lock-btn:hover { background: var(--blue); }

/* ── NAV ── */
nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  height: 58px; background: color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center;
  padding-inline: 32px;
  justify-content: space-between;
}
.nav-brand { display: flex; flex-direction: column; gap: 1px; text-decoration: none; }
.nav-name { font-family: 'Cormorant', serif; font-style: italic; font-size: 15px; color: var(--ink); }
.nav-tag { font-size: 8px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--ink-faint); }
.nav-right { display: flex; align-items: center; gap: 20px; }
.nav-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint); }

/* ── PAGE ── */
.page { padding-inline: 32px; }
.page-header {
  padding-block: 44px 28px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  flex-wrap: wrap;
}
.eyebrow {
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--blue);
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.eyebrow::before { content:''; width: 18px; height: 1px; background: var(--blue); }
.page-title { font-family: 'Cormorant', serif; font-size: clamp(32px, 4vw, 48px); font-weight: 300; color: var(--ink); line-height: 1; }
.hdr-actions { display: flex; gap: 10px; align-items: center; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: none; font-family: 'Outfit', sans-serif; font-size: 10px;
  letter-spacing: 1.6px; text-transform: uppercase; font-weight: 400;
  transition: background .2s, color .2s, border-color .2s;
  white-space: nowrap; text-decoration: none;
}
.btn-solid { background: var(--ink); color: var(--bg); padding: 10px 22px; }
.btn-solid:hover { background: var(--blue); }
.btn-ghost { background: transparent; border: 1px solid var(--rule); color: var(--ink-light); padding: 9px 22px; }
.btn-ghost:hover { border-color: var(--ink-light); color: var(--ink); }
.btn-danger { background: var(--red-faint); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 25%, transparent); padding: 9px 20px; }
.btn-danger:hover { background: var(--red); color: #fff; }

/* ── STATS ── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-block: 36px; }
.stat { background: var(--surface); padding: 26px 28px; }
.stat-lbl { font-size: 8px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
.stat-val { font-family: 'Cormorant', serif; font-size: 38px; font-weight: 300; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 11px; color: var(--ink-light); margin-top: 4px; }
.stat-sub em { font-style: normal; color: var(--green); }

/* ── TOOLBAR ── */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; width: 14px; height: 14px; }
.search-inp {
  width: 100%; padding: 9px 12px 9px 38px;
  border: 1px solid var(--rule); background: var(--surface);
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 300;
  color: var(--ink); outline: none; transition: border-color .2s;
}
.search-inp:focus { border-color: var(--blue); }
.search-inp::placeholder { color: var(--ink-faint); }
.flt {
  padding: 9px 12px; border: 1px solid var(--rule); background: var(--surface);
  font-family: 'Outfit', sans-serif; font-size: 11px; color: var(--ink-light);
  outline: none; cursor: pointer; transition: border-color .2s;
}
.flt:focus { border-color: var(--blue); }
.count { font-size: 11px; color: var(--ink-faint); margin-left: auto; }

/* ── TABLE ── */
.tbl-wrap { border: 1px solid var(--rule); overflow-x: auto; background: var(--surface); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
thead th {
  padding: 12px 18px; text-align: left;
  font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint);
  font-weight: 400; border-bottom: 1px solid var(--rule); background: var(--off);
  white-space: nowrap; cursor: pointer; user-select: none; transition: color .15s;
}
thead th:hover { color: var(--ink-light); }
thead th.asc::after { content: ' ↑'; }
thead th.desc::after { content: ' ↓'; }
tbody tr { border-bottom: 1px solid var(--rule); cursor: pointer; transition: background .12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--blue-faint); }
td { padding: 14px 18px; font-size: 12px; color: var(--ink-light); vertical-align: middle; }
td.nm { color: var(--ink); font-weight: 400; }
td.nm small { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
td.amt { font-family: 'Cormorant', serif; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── BADGES ── */
.badge {
  display: inline-block; padding: 2px 9px;
  font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
  border: 1px solid transparent;
}
.b-new      { background: var(--blue-faint);   color: var(--blue);   border-color: color-mix(in srgb, var(--blue) 20%, transparent); }
.b-contacted{ background: var(--amber-faint);  color: var(--amber);  border-color: color-mix(in srgb, var(--amber) 20%, transparent); }
.b-proposal { background: var(--purple-faint); color: var(--purple); border-color: color-mix(in srgb, var(--purple) 20%, transparent); }
.b-progress { background: var(--green-faint);  color: var(--green);  border-color: color-mix(in srgb, var(--green) 20%, transparent); }
.b-won      { background: var(--green-faint);  color: var(--green);  border-color: var(--green-faint); font-weight: 500; }
.b-lost     { background: var(--red-faint);    color: var(--red);    border-color: color-mix(in srgb, var(--red) 20%, transparent); }

/* ── EMPTY ── */
.empty { padding: 72px 20px; text-align: center; background: var(--surface); border: 1px solid var(--rule); }
.empty p { font-family: 'Cormorant', serif; font-size: 20px; font-weight: 300; color: var(--ink-faint); margin-bottom: 6px; }
.empty small { font-size: 11px; color: var(--ink-faint); }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--rule);
  width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
  animation: mIn .18s ease;
}
@keyframes mIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.modal-hdr {
  padding: 28px 32px 20px;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-ttl { font-family: 'Cormorant', serif; font-size: 26px; font-weight: 300; color: var(--ink); }
.modal-x { background: none; border: none; cursor: pointer; color: var(--ink-faint); font-size: 18px; line-height: 1; padding: 2px; transition: color .15s; }
.modal-x:hover { color: var(--ink); }
.modal-body { padding: 24px 32px; }
.modal-foot { padding: 16px 32px 28px; border-top: 1px solid var(--rule); display: flex; gap: 10px; justify-content: flex-end; }

/* ── FORM ── */
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fg .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint); }
.field input, .field select, .field textarea {
  padding: 10px 12px; border: 1px solid var(--rule); background: var(--off);
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 300; color: var(--ink); outline: none;
  transition: border-color .2s, background .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); background: var(--surface); }
.field textarea { resize: vertical; min-height: 80px; }

/* ── DETAIL ── */
.detail-row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.detail-row:last-of-type { border-bottom: none; }
.dlbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint); min-width: 118px; }
.dval { font-size: 12px; color: var(--ink); flex: 1; line-height: 1.6; }
.det-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 9000;
  background: var(--ink); color: var(--bg);
  padding: 12px 22px; font-size: 12px; font-weight: 300;
  opacity: 0; transform: translateY(6px);
  transition: opacity .22s, transform .22s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* ── RESPONSIVE ── */
@media (max-width: 800px) {
  .stats { grid-template-columns: 1fr 1fr; }
  nav, .page { padding-inline: 20px; }
}
@media (max-width: 520px) {
  .stats { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; align-items: flex-start; }
  .fg { grid-template-columns: 1fr; }
  .fg .full { grid-column: 1; }
}

</style>
</head>

  {id:uid(),firstName:'Isabella',lastName:'Laurent',email:'i.laurent@atelierx.fr',phone:'+33 1 23 45 67 89',type:'Home Gym',budget:'£50k – £100k',timeline:'3–6 months',status:'Lost',notes:'Paris apartment. Budget constraints — went with local contractor.',date:ago(45)},
];

const BMAP = {'Under £25k':12500,'£25k – £50k':37500,'£50k – £100k':75000,'£100k – £250k':175000,'£250k – £500k':375000,'£500k+':750000};
const SCYCLE = ['New','Contacted','Proposal Sent','In Progress','Won'];

let leads=[], eid=null, vid=null, sc='date', sd='desc';

// ── AUTH ──────────────────────────────────────────────────────────────
function unlock(){
  const v=document.getElementById('li').value.trim();
  if(v===CODE){
    try{sessionStorage.setItem('mfe_ok','1');}catch(e){}
    document.getElementById('lock').hidden=true;
    document.getElementById('dash').hidden=false;
    load();
  } else {
    const el=document.getElementById('li');
    document.getElementById('le').textContent='Incorrect code — try again.';
    el.value=''; el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),400);
  }
}
document.getElementById('li').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
try{ if(sessionStorage.getItem('mfe_ok')==='1'){ document.getElementById('lock').hidden=true; document.getElementById('dash').hidden=false; } }catch(e){}

// ── DATA ──────────────────────────────────────────────────────────────
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){leads=JSON.parse(r);}else{leads=DEMO;save_();} }
  catch(e){ leads=DEMO; }
  stats(); render();
}
function save_(){ try{localStorage.setItem(KEY,JSON.stringify(leads));}catch(e){} }

// ── STATS ──────────────────────────────────────────────────────────────
function stats(){
  const now=new Date();
  const mon=leads.filter(l=>{ const d=new Date(l.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); });
  const active=leads.filter(l=>['Contacted','Proposal Sent','In Progress'].includes(l.status));
  const pipe=leads.filter(l=>!['Won','Lost'].includes(l.status)&&l.budget).reduce((s,l)=>s+(BMAP[l.budget]||0),0);
  document.getElementById('stats').innerHTML=[
    ['Total Leads', leads.length, 'All time'],
    ['New This Month', mon.length, now.toLocaleString('default',{month:'long'})],
    ['Active Pipeline', active.length, 'In progress'],
    ['Est. Pipeline', pipe?'£'+(pipe/1000|0)+'k':'—', 'Open budgets'],
  ].map(([l,v,s])=>`<div class="stat"><div class="stat-lbl">${l}</div><div class="stat-val">${v}</div><div class="stat-sub">${s}</div></div>`).join('');
}

// ── TABLE ──────────────────────────────────────────────────────────────
const BCLS={New:'b-new',Contacted:'b-contacted','Proposal Sent':'b-proposal','In Progress':'b-progress',Won:'b-won',Lost:'b-lost'};
function badge(s){ return `<span class="badge ${BCLS[s]||'b-new'}">${s}</span>`; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const st=document.getElementById('fs').value;
  const ty=document.getElementById('ft').value;
  return leads.filter(l=>{
    const nm=(l.firstName+' '+l.lastName).toLowerCase();
    const mq=!q||nm.includes(q)||(l.email||'').toLowerCase().includes(q)||(l.type||'').toLowerCase().includes(q)||(l.notes||'').toLowerCase().includes(q);
    return mq&&(!st||l.status===st)&&(!ty||l.type===ty);
  });
}
function srt(arr){
  return [...arr].sort((a,b)=>{
    let av,bv;
    if(sc==='name'){av=(a.firstName+a.lastName).toLowerCase();bv=(b.firstName+b.lastName).toLowerCase();}
    else if(sc==='date'){av=new Date(a.date);bv=new Date(b.date);}
    else if(sc==='budget'){av=BMAP[a.budget]||0;bv=BMAP[b.budget]||0;}
    else{av=(a[sc]||'').toLowerCase();bv=(b[sc]||'').toLowerCase();}
    return av<bv?(sd==='asc'?-1:1):av>bv?(sd==='asc'?1:-1):0;
  });
}
function setS(c){ sc===c?sd=sd==='asc'?'desc':'asc':(sc=c,sd='asc'); render(); }

const COLS=[
  {k:'name',l:'Name'},{k:'type',l:'Project Type'},{k:'budget',l:'Budget'},
  {k:'timeline',l:'Timeline'},{k:'status',l:'Status'},{k:'date',l:'Date'},
];
function render(){
  const rows=srt(filtered());
  document.getElementById('cnt').textContent=rows.length+' lead'+(rows.length!==1?'s':'');
  const c=document.getElementById('tbl');
  if(!rows.length){ c.innerHTML='<div class="empty"><p>No leads found</p><small>Adjust your filters or add a new lead</small></div>'; return; }
  let h='<div class="tbl-wrap"><table><thead><tr>';
  COLS.forEach(({k,l})=>{ const cls=sc===k?sd:''; h+=`<th class="${cls}" onclick="setS('${k}')">${l}</th>`; });
  h+='</tr></thead><tbody>';
  rows.forEach(l=>{
    const dt=new Date(l.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    h+=`<tr onclick="det('${l.id}')">
      <td class="nm">${esc(l.firstName)} ${esc(l.lastName)}<small>${esc(l.email)}</small></td>
      <td>${esc(l.type||'—')}</td>
      <td class="amt">${esc(l.budget||'—')}</td>
      <td>${esc(l.timeline||'—')}</td>
      <td>${badge(l.status)}</td>
      <td>${dt}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  c.innerHTML=h;
}

// ── ADD/EDIT ──────────────────────────────────────────────────────────
function openAdd(){ eid=null; clrF(); document.getElementById('m-ttl').textContent='Add Lead'; oModal('m-add'); }
function clrF(){
  ['ff','fl','fe','fp','fn'].forEach(i=>document.getElementById(i).value='');
  ['ftype','fb','ftl'].forEach(i=>document.getElementById(i).selectedIndex=0);
  document.getElementById('fst').value='New';
}
function save(){
  const f=document.getElementById('ff').value.trim(), l=document.getElementById('fl').value.trim(), e=document.getElementById('fe').value.trim();
  if(!f||!l||!e){ toast('First name, last name and email are required.'); return; }
  if(eid){
    const i=leads.findIndex(x=>x.id===eid);
    if(i>-1) leads[i]={...leads[i],firstName:f,lastName:l,email:e,phone:document.getElementById('fp').value.trim(),type:document.getElementById('ftype').value,budget:document.getElementById('fb').value,timeline:document.getElementById('ftl').value,status:document.getElementById('fst').value,notes:document.getElementById('fn').value.trim()};
    toast('Lead updated.');
  } else {
    leads.unshift({id:uid(),firstName:f,lastName:l,email:e,phone:document.getElementById('fp').value.trim(),type:document.getElementById('ftype').value,budget:document.getElementById('fb').value,timeline:document.getElementById('ftl').value,status:document.getElementById('fst').value,notes:document.getElementById('fn').value.trim(),date:new Date().toISOString()});
    toast('Lead added.');
  }
  save_(); stats(); render(); cModal('m-add');
}

// ── DETAIL ────────────────────────────────────────────────────────────
function det(id){
  vid=id; const l=leads.find(x=>x.id===id); if(!l) return;
  document.getElementById('d-name').textContent=l.firstName+' '+l.lastName;
  document.getElementById('d-badge').innerHTML=badge(l.status);
  const dt=new Date(l.date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('d-rows').innerHTML=[
    ['Email',`<span style="display:inline-flex;align-items:center;gap:8px"><span style="color:var(--ink)">${esc(l.email)}</span><a href="https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(l.email)}" target="_blank" rel="noopener" style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--blue-faint);border:1px solid color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue);padding:2px 8px;text-decoration:none;">Gmail ↗</a><button onclick="copyTxt('${esc(l.email)}')" style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--off);border:1px solid var(--rule);color:var(--ink-light);padding:2px 8px;cursor:pointer;">Copy</button></span>`],
    ['Phone',l.phone?`<span style="display:inline-flex;align-items:center;gap:8px"><span style="color:var(--ink)">${esc(l.phone)}</span><button onclick="copyTxt('${esc(l.phone)}')" style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--off);border:1px solid var(--rule);color:var(--ink-light);padding:2px 8px;cursor:pointer;">Copy</button></span>`:'—'],
    ['Project Type',l.type||'—'],
    ['Budget',l.budget||'—'],
    ['Timeline',l.timeline||'—'],
    ['Notes',l.notes?esc(l.notes):'—'],
    ['Date Added',dt],
  ].map(([k,v])=>`<div class="detail-row"><span class="dlbl">${k}</span><span class="dval">${v}</span></div>`).join('');
  oModal('m-det');
}
function editFromDet(){
  const l=leads.find(x=>x.id===vid); if(!l) return;
  cModal('m-det'); eid=l.id;
  document.getElementById('ff').value=l.firstName;
  document.getElementById('fl').value=l.lastName;
  document.getElementById('fe').value=l.email;
  document.getElementById('fp').value=l.phone||'';
  document.getElementById('ftype').value=l.type||'';
  document.getElementById('fb').value=l.budget||'';
  document.getElementById('ftl').value=l.timeline||'';
  document.getElementById('fst').value=l.status||'New';
  document.getElementById('fn').value=l.notes||'';
  document.getElementById('m-ttl').textContent='Edit Lead';
  oModal('m-add');
}
function advStatus(){
  const l=leads.find(x=>x.id===vid); if(!l) return;
  const i=SCYCLE.indexOf(l.status);
  l.status=SCYCLE[Math.min(i+1,SCYCLE.length-1)];
  save_(); stats(); render(); det(vid); toast('Status → '+l.status);
}
function del(){
  if(!confirm('Delete this lead? This cannot be undone.')) return;
  leads=leads.filter(l=>l.id!==vid); save_(); stats(); render(); cModal('m-det'); toast('Lead deleted.');
}

// ── EXPORT ────────────────────────────────────────────────────────────
function exportCSV(){
  const hdr=['First Name','Last Name','Email','Phone','Project Type','Budget','Timeline','Status','Notes','Date'];
  const rows=leads.map(l=>[l.firstName,l.lastName,l.email,l.phone||'',l.type||'',l.budget||'',l.timeline||'',l.status,l.notes||'',new Date(l.date).toLocaleDateString('en-GB')].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  const csv=[hdr.join(','),...rows].join('\n');
  // Copy to clipboard as fallback (artifact download links are inert for viewers)
  navigator.clipboard.writeText(csv).then(()=>toast('CSV copied to clipboard.')).catch(()=>toast('Select all text in console to copy CSV.'));
}

// ── MODAL HELPERS ─────────────────────────────────────────────────────
function oModal(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function cModal(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function oClose(e,id){ if(e.target===document.getElementById(id)) cModal(id); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ cModal('m-add'); cModal('m-det'); } });

// ── COPY ──────────────────────────────────────────────────────────────
function copyTxt(s){
  navigator.clipboard.writeText(s).then(()=>toast('Copied.')).catch(()=>{
    const el=document.createElement('textarea'); el.value=s;
    el.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(el); el.select();
    try{document.execCommand('copy');toast('Copied.');}catch(e){toast(s);}
    document.body.removeChild(el);
  });
}

// ── TOAST ─────────────────────────────────────────────────────────────
let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2800); }

// auto-init if already unlocked
try{ if(sessionStorage.getItem('mfe_ok')==='1') load(); }catch(e){}
</script>
</body>
</html>
