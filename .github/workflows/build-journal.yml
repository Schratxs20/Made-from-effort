name: Build Journal

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/build_journal.py"
      - "scripts/build_ai_assets.py"
      - "requirements-build.txt"
      - "config/business-facts.json"
      - "*.html"
      - "llms.txt"
      - "sitemap.xml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build journal (posts, index, RSS feed)
        run: python3 scripts/build_journal.py

      - name: Check sitemap and canonical URLs
        run: python3 -m unittest discover -s tests

      - name: Commit generated files
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add journal/ sitemap.xml ai-pages/ api/facts.json llm-info.html _ai-page-data.js llms.txt '*.html'
          git diff --cached --quiet || git commit -m "Auto-build journal"
          git push
