name: Podcast to Draft Post

on:
  schedule:
    # Every Monday at 13:00 UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-podcast.txt

      - name: Fetch, transcribe, and draft
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/podcast_to_post.py

      - name: Commit draft (if any)
        run: |
          git config user.name "podcast-draft-bot"
          git config user.email "podcast-draft-bot@users.noreply.github.com"
          git add posts/banked/ config/podcast_state.json
          git diff --cached --quiet || git commit -m "Draft post from new podcast episode(s)"
          git push
